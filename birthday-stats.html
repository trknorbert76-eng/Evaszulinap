<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szülinapi statisztika</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
  padding:28px;
}
h1{
  margin:0 0 24px;
  font-size:32px;
}
h2{
  margin:34px 0 14px;
  font-size:22px;
  color:#ffd27a;
}
table{
  border-collapse:collapse;
  width:100%;
  max-width:900px;
  margin-bottom:20px;
}
th,td{
  border:1px solid #444;
  padding:12px;
  text-align:left;
}
th{
  background:#222;
}
tr:nth-child(even){
  background:#1a1a1a;
}
.note{
  color:#bbb;
  margin-bottom:24px;
  line-height:1.5;
}
</style>
</head>
<body>

<h1>Szülinapi statisztika</h1>
<div class="note">
  Csak a szülinapos oldal mérései.<br>
  A normál lista 10 videós, a két titkos videó külön van mérve.
</div>

<h2>1. Fő videó</h2>
<table>
  <thead>
    <tr>
      <th>Esemény</th>
      <th>Darab</th>
    </tr>
  </thead>
  <tbody id="mainVideoTable"></tbody>
</table>

<h2>2. PIN / Belépés</h2>
<table>
  <thead>
    <tr>
      <th>Esemény</th>
      <th>Darab</th>
    </tr>
  </thead>
  <tbody id="pinTable"></tbody>
</table>

<h2>3. Ajándék videók összesen</h2>
<table>
  <thead>
    <tr>
      <th>Esemény</th>
      <th>Darab</th>
    </tr>
  </thead>
  <tbody id="giftSummaryTable"></tbody>
</table>

<h2>4. Videónkénti bontás</h2>
<table>
  <thead>
    <tr>
      <th>Videó</th>
      <th>Indítás</th>
    </tr>
  </thead>
  <tbody id="giftItemsTable"></tbody>
</table>

<script>
const SUPABASE_URL = "https://hhysuxfwdjwlxtmlxnrv.supabase.co";
const SUPABASE_KEY = "sb_publishable_4Btoi0wsypr48xQH31RMaQ_r1YrPpsv";
const TABLE_NAME = "birthday_stats";

const videoNames = {
  1: "3 vers a szerelemről",
  2: "25 évesen",
  3: "Párizs – Room tour",
  4: "Legszebb",
  5: "Évámnak a boldogságról",
  6: "Márciusi hasonlat",
  7: "25. házassági évfordulónkra",
  8: "Mindhalálig",
  9: "29. házassági évfordulónkra",
  10: "Ahogy vagy"
};

function countEvents(rows){
  const counts = {};
  rows.forEach(row => {
    counts[row.event] = (counts[row.event] || 0) + 1;
  });
  return counts;
}

function addRow(tbody, label, value){
  const tr = document.createElement("tr");

  const td1 = document.createElement("td");
  td1.textContent = label;

  const td2 = document.createElement("td");
  td2.textContent = value || 0;

  tr.appendChild(td1);
  tr.appendChild(td2);
  tbody.appendChild(tr);
}

async function loadStats(){
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=event`,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    }
  );

  const data = await res.json();
  const counts = countEvents(data);

  const mainVideoTable = document.getElementById("mainVideoTable");
  const pinTable = document.getElementById("pinTable");
  const giftSummaryTable = document.getElementById("giftSummaryTable");
  const giftItemsTable = document.getElementById("giftItemsTable");

  addRow(mainVideoTable, "Bicajos út – indítás", counts["main_video_start"]);
  addRow(mainVideoTable, "Bicajos út – végéig jutás", counts["main_video_end"]);

  addRow(pinTable, "PIN próbálkozás összesen", counts["pin_attempt_total"]);
  addRow(pinTable, "Helyes PIN", counts["pin_correct"]);
  addRow(pinTable, "Hibás PIN", counts["pin_wrong"]);
  addRow(pinTable, "Üres tovább", counts["pin_empty_continue"]);

  addRow(giftSummaryTable, "Összes ajándék videó indítás", counts["gift_video_started_total"]);
  addRow(giftSummaryTable, "Ebből random", counts["gift_video_started_random"]);
  addRow(giftSummaryTable, "Ebből PIN-es külön videó", counts["gift_video_started_pin"]);
  addRow(giftSummaryTable, "Ebből listából indított", counts["gift_video_started_manual"]);

  for (let i = 1; i <= 10; i++) {
    addRow(giftItemsTable, videoNames[i], counts[`gift_video_item_${i}`]);
  }

  addRow(giftItemsTable, "🎁 Róka 2 – Ajándék videó", counts["gift_video_item_pin_1"]);
  addRow(giftItemsTable, "🎬 Tyúk1 – Reakció", counts["gift_video_item_pin_2"]);
}

loadStats();
</script>

</body>
</html>
