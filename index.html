<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Szülinapi projekt</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .active {
      display: flex;
    }

    .coverWrap {
      position: relative;
    }

    img {
      max-width: 90vw;
      max-height: 90vh;
    }

    #playBtn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      background: transparent;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* VIDEÓ */
    #mainVideo {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      pointer-events: none; /* EZ A LÉNYEG */
    }

    /* LÁTHATATLAN KATT ZÓNA */
    #randomGiftBtn {
      position: fixed;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 110px;
      background: transparent;
      border: none;
      display: none;
      z-index: 9999;
      cursor: pointer;
    }

    /* MOBIL FEKVŐ */
    @media (orientation: landscape) {
      #randomGiftBtn {
        top: 60%;
        width: 220px;
        height: 120px;
      }
    }

    /* POPUP */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    #overlay video {
      width: 90%;
      height: auto;
    }

    #closeBtn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 30px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- START -->
<div id="startScreen" class="screen active">
  <div class="coverWrap">
    <img src="kezdes.png">
    <button id="playBtn">PLAY</button>
  </div>
</div>

<!-- VIDEO -->
<div id="videoScreen" class="screen">
  <video id="mainVideo" playsinline></video>
  <button id="randomGiftBtn"></button>
</div>

<!-- POPUP -->
<div id="overlay">
  <div id="closeBtn">×</div>
  <video id="giftVideo" controls></video>
</div>

<script>
const playBtn = document.getElementById('playBtn');
const mainVideo = document.getElementById('mainVideo');
const randomBtn = document.getElementById('randomGiftBtn');

const startScreen = document.getElementById('startScreen');
const videoScreen = document.getElementById('videoScreen');

const overlay = document.getElementById('overlay');
const giftVideo = document.getElementById('giftVideo');
const closeBtn = document.getElementById('closeBtn');

const VIDEO = "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774195689/utols%C3%B3ok_utols%C3%B3oja_qawodm.mp4";

const gifts = [
  "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134175/T%C3%B6r%C3%B6k_Norbert_3_vers_a_szerelemr%C5%91l_gm8zu6.mp4"
];

mainVideo.src = VIDEO;

playBtn.onclick = async () => {
  startScreen.classList.remove('active');
  videoScreen.classList.add('active');

  await mainVideo.play();
};

mainVideo.ontimeupdate = () => {
  if (mainVideo.currentTime > 257) {
    randomBtn.style.display = 'block';
  }
};

randomBtn.onclick = () => {
  mainVideo.pause();

  giftVideo.src = gifts[0];
  overlay.style.display = 'flex';

  giftVideo.play();
};

closeBtn.onclick = () => {
  overlay.style.display = 'none';
  giftVideo.pause();
  mainVideo.play();
};
</script>

</body>
</html>
