<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Szülinapi projekt</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, "Times New Roman", serif;
      touch-action: manipulation;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .screen.active {
      display: flex;
    }

    #startScreen {
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 45%),
        #000;
    }

    .coverWrap {
      position: relative;
      width: min(1100px, 88vw);
      height: min(92vh, 920px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coverImage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      box-shadow: 0 0 50px rgba(0,0,0,0.55);
    }

    #playBtn {
      position: absolute;
      left: 32%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 130px;
      border: 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff4d6;
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow:
        0 0 8px rgba(0,0,0,0.95),
        0 0 18px rgba(0,0,0,0.85),
        2px 2px 0 rgba(0,0,0,0.9);
      z-index: 5;
    }

    #videoScreen {
      position: fixed;
      inset: 0;
      background: #000;
    }

    #mainVideo {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* PC-n láthatatlan kattintható terület */
    #randomGiftBtn {
      position: fixed;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: 330px;
      height: 150px;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      background: transparent;
      display: none;
      z-index: 9999;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      padding: 0;
    }

    .giftOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.38);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 20000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .giftOverlay.show {
      display: flex;
      opacity: 1;
    }

    .giftOverlay.withBg {
      background: url('hatter.png') center/cover no-repeat;
    }

    .giftBox {
      width: min(1180px, 86vw);
      height: min(680px, 78vh);
      background: rgba(0,0,0,0.86);
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .giftOverlay.show .giftBox {
      transform: scale(1);
    }

    #giftVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      border-radius: 26px;
      display: none;
    }

    #closeGiftBtn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 28px;
      line-height: 1;
      background: rgba(255,255,255,0.92);
      color: #111;
      z-index: 60;
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    }

    #backBtn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 10000;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 20px;
      background: rgba(0,0,0,0.6);
      color: white;
      backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;
    }

    /* Mobil saját vezérlők */
    #mobileControls {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      display: none;
      gap: 12px;
      z-index: 12000;
      align-items: center;
      justify-content: center;
    }

    #mobileControls button {
      min-width: 58px;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: rgba(0,0,0,0.62);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 700px) {
      #mainVideo {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
      }

      /* Mobilon látszó gomb */
      #randomGiftBtn {
        left: 50%;
        top: 58.5%;
        width: 230px;
        height: 110px;
        border-radius: 0;
        background: url('kattide.png?v=1') center/contain no-repeat;
        background-color: transparent;
        z-index: 99999;
        pointer-events: auto;
      }

      .giftBox {
        width: 94vw;
        height: 54vh;
        border-radius: 20px;
      }

      #giftVideo {
        object-fit: contain;
        border-radius: 20px;
      }

      #closeGiftBtn {
        width: 42px;
        height: 42px;
        font-size: 26px;
      }

      #backBtn {
        top: 12px;
        right: 12px;
      }

      #mobileControls {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <section id="startScreen" class="screen active">
    <div class="coverWrap">
      <img class="coverImage" src="kezdes.png" alt="Kezdőkép">
      <button id="playBtn" aria-label="Lejátszás">PLAY</button>
    </div>
  </section>

  <section id="videoScreen" class="screen">
    <video
      id="mainVideo"
      playsinline
      webkit-playsinline
      preload="auto"
      controls
      controlsList="nodownload noplaybackrate nofullscreen"
      disablePictureInPicture
    ></video>
  </section>

  <div id="mobileControls">
    <button id="mBackBtn" type="button">⏪</button>
    <button id="mPlayBtn" type="button">⏸</button>
    <button id="mFwdBtn" type="button">⏩</button>
  </div>

  <button id="randomGiftBtn" aria-label="Ajándék videó"></button>

  <div id="giftOverlay" class="giftOverlay">
    <div class="giftBox">
      <button id="closeGiftBtn" type="button">×</button>
      <video
        id="giftVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
      ></video>
    </div>
  </div>

  <button id="backBtn" type="button">⟲</button>

  <script>
    const startScreen = document.getElementById('startScreen');
    const videoScreen = document.getElementById('videoScreen');

    const playBtn = document.getElementById('playBtn');
    const mainVideo = document.getElementById('mainVideo');

    const randomGiftBtn = document.getElementById('randomGiftBtn');
    const giftOverlay = document.getElementById('giftOverlay');
    const giftVideo = document.getElementById('giftVideo');
    const closeGiftBtn = document.getElementById('closeGiftBtn');
    const backBtn = document.getElementById('backBtn');

    const mobileControls = document.getElementById('mobileControls');
    const mBackBtn = document.getElementById('mBackBtn');
    const mPlayBtn = document.getElementById('mPlayBtn');
    const mFwdBtn = document.getElementById('mFwdBtn');

    const isMobile = window.innerWidth <= 700;

    const DESKTOP_VIDEO = "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774195689/utols%C3%B3ok_utols%C3%B3oja_qawodm.mp4";
    const MOBILE_VIDEO = "https://res.cloudinary.com/dgcumjeuj/video/upload/q_auto,f_auto/v1774195689/utols%C3%B3ok_utols%C3%B3oja_qawodm.mp4";

    const VIDEO_URL = (isMobile ? MOBILE_VIDEO : DESKTOP_VIDEO) + "?t=" + Date.now();

    const giftVideos = [
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134175/T%C3%B6r%C3%B6k_Norbert_3_vers_a_szerelemr%C5%91l_gm8zu6.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134156/25_%C3%A9vesen---T%C3%B6r%C3%B6k_Norbert_verse_am6wtk.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134159/P%C3%A1rizs_Room_tour_2025_rnchhh.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134153/Legszebb----T%C3%B6r%C3%B6k_Norbert_verse_bq7ori.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134139/%C3%88v%C3%A1mnak_a_boldogs%C3%A1gr%C3%B3l_T%C3%B6r%C3%B6k_Norbert_verse_kwx2lb.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134129/25_H%C3%A1zass%C3%A1gi_%C3%A9vfordul%C3%B3nkra_howpjg.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134104/T%C3%B6r%C3%B6k_Norbert_Mindhal%C3%A1lig_wtvuc8.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134106/%C3%88vfordul%C3%B3_29._aqqeaq.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134099/T%C3%B6r%C3%B6k_Norbert_Ahogy_vagy.._n3ukws.mp4'
    ];

    /* PC logika */
    const PC_GIFT_SHOW_TIME = 255; // 4:15
    const PC_LOOP_START = 257;     // 4:17
    const PC_LOOP_END = 260;       // 4:20

    /* Mobil logika */
    const MOBILE_BLOCK_TIME = 250;     // 4:10
    const MOBILE_GIFT_SHOW_TIME = 257; // 4:17
    const MOBILE_LOOP_START = 257;     // 4:17
    const MOBILE_LOOP_END = 260;       // 4:20

    let giftBtnVisible = false;
    let endMode = false;
    let mobileBlockMode = false;

    mainVideo.src = VIDEO_URL;

    function showScreen(screen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function updateMobilePlayIcon() {
      if (!isMobile) return;
      mPlayBtn.textContent = mainVideo.paused ? '▶' : '⏸';
    }

    function showMobileControls() {
      if (isMobile && !mobileBlockMode) {
        mobileControls.style.display = 'flex';
      }
    }

    function hideMobileControls() {
      if (isMobile) {
        mobileControls.style.display = 'none';
      }
    }

    function closeGiftPopup() {
      giftVideo.pause();
      giftVideo.currentTime = 0;
      giftVideo.removeAttribute('src');
      giftVideo.load();
      giftVideo.style.display = 'none';

      giftOverlay.classList.remove('show');
      giftOverlay.classList.remove('withBg');
    }

    function resetMainVideoState() {
      if (isMobile) {
        mainVideo.controls = false;
        showMobileControls();
      } else {
        mainVideo.controls = true;
      }

      mainVideo.style.pointerEvents = 'auto';
      mainVideo.removeAttribute('tabindex');

      giftBtnVisible = false;
      endMode = false;
      mobileBlockMode = false;
      randomGiftBtn.style.display = 'none';
      updateMobilePlayIcon();
    }

    function lockMobileVideo() {
      mainVideo.controls = false;
      mainVideo.style.pointerEvents = 'none';
      mainVideo.setAttribute('tabindex', '-1');
      hideMobileControls();
      mobileBlockMode = true;
    }

    playBtn.addEventListener('click', async () => {
      showScreen(videoScreen);
      resetMainVideoState();
      closeGiftPopup();

      try {
        mainVideo.currentTime = 0;
        await mainVideo.play();
        updateMobilePlayIcon();
      } catch (err) {
        console.log('A fő videó nem indult el:', err);
      }
    });

    mPlayBtn.addEventListener('click', () => {
      if (!isMobile || mobileBlockMode) return;

      if (mainVideo.paused) {
        mainVideo.play().then(updateMobilePlayIcon).catch(() => {});
      } else {
        mainVideo.pause();
        updateMobilePlayIcon();
      }
    });

    mBackBtn.addEventListener('click', () => {
      if (!isMobile || mobileBlockMode) return;
      mainVideo.currentTime = Math.max(0, mainVideo.currentTime - 10);
    });

    mFwdBtn.addEventListener('click', () => {
      if (!isMobile || mobileBlockMode) return;
      const limit = Math.max(0, MOBILE_BLOCK_TIME - 0.2);
      mainVideo.currentTime = Math.min(limit, mainVideo.currentTime + 10);
    });

    mainVideo.addEventListener('play', updateMobilePlayIcon);
    mainVideo.addEventListener('pause', updateMobilePlayIcon);

    mainVideo.addEventListener('timeupdate', () => {
      if (isMobile) {
        if (!mobileBlockMode && mainVideo.currentTime >= MOBILE_BLOCK_TIME) {
          lockMobileVideo();
        }

        if (!giftBtnVisible && mainVideo.currentTime >= MOBILE_GIFT_SHOW_TIME) {
          randomGiftBtn.style.display = 'block';
          giftBtnVisible = true;
        }

        if (!endMode && mainVideo.currentTime >= MOBILE_LOOP_START) {
          endMode = true;
        }

        if (endMode && mainVideo.currentTime >= MOBILE_LOOP_END) {
          mainVideo.currentTime = MOBILE_LOOP_START;
          mainVideo.play().catch(() => {});
        }

        return;
      }

      if (!giftBtnVisible && mainVideo.currentTime >= PC_GIFT_SHOW_TIME) {
        randomGiftBtn.style.display = 'block';
        giftBtnVisible = true;
      }

      if (!endMode && mainVideo.currentTime >= PC_LOOP_START) {
        endMode = true;
        mainVideo.controls = false;
      }

      if (endMode && mainVideo.currentTime >= PC_LOOP_END) {
        mainVideo.currentTime = PC_LOOP_START;
        mainVideo.play().catch(() => {});
      }
    });

    mainVideo.addEventListener('seeking', () => {
      if (isMobile) {
        if (mobileBlockMode && mainVideo.currentTime > MOBILE_BLOCK_TIME) {
          mainVideo.currentTime = MOBILE_LOOP_START;
        }
        if (endMode && mainVideo.currentTime > MOBILE_LOOP_START) {
          mainVideo.currentTime = MOBILE_LOOP_START;
        }
        return;
      }

      if (endMode && mainVideo.currentTime > PC_LOOP_START) {
        mainVideo.currentTime = PC_LOOP_START;
      }
    });

    function openGift(e) {
      if (e) e.preventDefault();
      if (giftOverlay.classList.contains('show')) return;
      if (!giftVideos.length) return;

      const randomIndex = Math.floor(Math.random() * giftVideos.length);
      const chosenVideo = giftVideos[randomIndex];

      mainVideo.pause();

      giftOverlay.classList.add('show');
      giftOverlay.classList.add('withBg');

      giftVideo.src = chosenVideo;
      giftVideo.style.display = 'block';
      giftVideo.load();
      giftVideo.play().catch(err => {
        console.log('A random videó nem indult el automatikusan:', err);
      });
    }

    randomGiftBtn.addEventListener('click', openGift);

    giftOverlay.addEventListener('click', (e) => {
      if (e.target === giftOverlay) {
        closeGiftPopup();

        if (isMobile && endMode) {
          mainVideo.currentTime = MOBILE_LOOP_START;
        } else if (!isMobile && endMode) {
          mainVideo.currentTime = PC_LOOP_START;
        }

        mainVideo.play().catch(() => {});
        updateMobilePlayIcon();
      }
    });

    closeGiftBtn.addEventListener('click', () => {
      closeGiftPopup();

      if (isMobile && endMode) {
        mainVideo.currentTime = MOBILE_LOOP_START;
      } else if (!isMobile && endMode) {
        mainVideo.currentTime = PC_LOOP_START;
      }

      mainVideo.play().catch(() => {});
      updateMobilePlayIcon();
    });

    backBtn.addEventListener('click', () => {
      mainVideo.pause();
      mainVideo.currentTime = 0;
      resetMainVideoState();
      closeGiftPopup();
      showScreen(startScreen);
    });
  </script>
</body>
</html>
