<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Szülinapi projekt</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, "Times New Roman", serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .screen.active {
      display: flex;
    }

    #startScreen {
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 45%),
        #000;
    }

    .coverWrap {
      position: relative;
      width: min(1100px, 88vw);
      height: min(92vh, 920px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coverImage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      box-shadow: 0 0 50px rgba(0,0,0,0.55);
    }

    #playBtn {
      position: absolute;
      left: 32%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 130px;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #fff4d6;
      font-size: 34px;
      font-weight: bold;
    }

    #mainVideo {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    #randomGiftBtn {
      position: fixed;
      left: 50%;
      top: 57.5%;
      transform: translate(-50%, -50%);
      width: 165px;
      height: 92px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      z-index: 20;
      display: none;
    }

    /* 🎯 MOBIL VÉG KÉP */
    #mobileEndScreen {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 999999;
      background: url('vege.png') center/cover no-repeat;
    }

    #mobileEndBtn {
      position: absolute;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 120px;
      border: none;
      background: transparent;
      cursor: pointer;
    }

  </style>
</head>

<body>

<section id="startScreen" class="screen active">
  <div class="coverWrap">
    <img class="coverImage" src="kezdes.png">
    <button id="playBtn">PLAY</button>
  </div>
</section>

<section id="videoScreen" class="screen">
  <video id="mainVideo" playsinline preload="auto" controls></video>
</section>

<button id="randomGiftBtn"></button>

<!-- 🎯 MOBIL END -->
<div id="mobileEndScreen">
  <button id="mobileEndBtn"></button>
</div>

<script>
const isMobile = window.innerWidth <= 700;

const mainVideo = document.getElementById('mainVideo');
const playBtn = document.getElementById('playBtn');
const startScreen = document.getElementById('startScreen');
const videoScreen = document.getElementById('videoScreen');
const randomGiftBtn = document.getElementById('randomGiftBtn');

const mobileEndScreen = document.getElementById('mobileEndScreen');
const mobileEndBtn = document.getElementById('mobileEndBtn');

const VIDEO_URL = "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774195689/utols%C3%B3ok_utols%C3%B3oja_qawodm.mp4?t=" + Date.now();

mainVideo.src = VIDEO_URL;

const giftVideos = [
  'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134175/T%C3%B6r%C3%B6k_Norbert_3_vers_a_szerelemr%C5%91l_gm8zu6.mp4',
  'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134156/25_%C3%A9vesen---T%C3%B6r%C3%B6k_Norbert_verse_am6wtk.mp4'
];

const GIFT_SHOW_TIME = 257;
const LOOP_START = 259;
const LOOP_END = 260;
const MOBILE_END_TIME = 255;

let giftBtnVisible = false;
let loopMode = false;
let mobileEndShown = false;

function showScreen(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  screen.classList.add('active');
}

playBtn.addEventListener('click', async () => {
  showScreen(videoScreen);

  giftBtnVisible = false;
  loopMode = false;
  mobileEndShown = false;

  mobileEndScreen.style.display = 'none';
  randomGiftBtn.style.display = 'none';

  mainVideo.currentTime = 0;
  await mainVideo.play();
});

mainVideo.addEventListener('timeupdate', () => {

  // 📱 MOBIL
  if (isMobile) {
    if (!mobileEndShown && mainVideo.currentTime >= MOBILE_END_TIME) {
      mobileEndShown = true;

      mainVideo.pause();
      mainVideo.removeAttribute('controls');
      mainVideo.controls = false;

      mobileEndScreen.style.display = 'block';
    }
    return;
  }

  // 💻 PC
  if (!giftBtnVisible && mainVideo.currentTime >= GIFT_SHOW_TIME) {
    randomGiftBtn.style.display = 'block';
    giftBtnVisible = true;
  }

  if (!loopMode && mainVideo.currentTime >= LOOP_START) {
    loopMode = true;
  }

  if (loopMode && mainVideo.currentTime >= LOOP_END) {
    mainVideo.currentTime = LOOP_START;
    mainVideo.play();
  }
});

// 🎁 MOBIL GOMB
mobileEndBtn.addEventListener('click', () => {
  mobileEndScreen.style.display = 'none';

  const randomIndex = Math.floor(Math.random() * giftVideos.length);
  const chosenVideo = giftVideos[randomIndex];

  mainVideo.pause();
  mainVideo.src = chosenVideo;
  mainVideo.play();
});

// 💻 PC gomb
randomGiftBtn.addEventListener('click', () => {
  const randomIndex = Math.floor(Math.random() * giftVideos.length);
  mainVideo.src = giftVideos[randomIndex];
  mainVideo.play();
});
</script>

</body>
</html>
