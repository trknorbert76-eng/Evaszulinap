<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Szülinapi projekt</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, "Times New Roman", serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .screen.active {
      display: flex;
    }

    #startScreen {
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 45%),
        #000;
    }

    .coverWrap {
      position: relative;
      width: min(1100px, 88vw);
      height: min(92vh, 920px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coverImage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      box-shadow: 0 0 50px rgba(0,0,0,0.55);
    }

    #playBtn {
      position: absolute;
      left: 32%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 130px;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #fff4d6;
      font-size: 34px;
      font-weight: bold;
    }

    #mainVideo {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    /* PC-s ajándék gomb */
    #randomGiftBtn {
      position: fixed;
      left: 50%;
      top: 57.5%;
      transform: translate(-50%, -50%);
      width: 165px;
      height: 92px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      z-index: 20;
      display: none;
      background: transparent;
    }

    /* MOBIL VÉGKÉP */
    #mobileEndScreen {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 999999;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.92);
    }

    .mobileEndWrap {
      position: relative;
      width: min(92vw, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #mobileEndImage {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    #mobileEndBtn {
      position: absolute;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: 42%;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    #mobileEndBtn img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* RANDOM AJÁNDÉK OVERLAY */
    .giftOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000000;
      background: #000;
    }

    .giftOverlay.show {
      display: flex;
    }

    .giftOverlay.withBg {
      background: url('hatter.png') center center / cover no-repeat;
    }

    .giftBox {
      position: relative;
      width: min(92vw, 900px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.55);
    }

    #giftVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    #giftCloseBtn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.65);
      color: white;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      z-index: 5;
    }

    @media (max-width: 700px) {
      #playBtn {
        width: 180px;
        height: 110px;
        font-size: 28px;
      }

      .giftBox {
        width: 92vw;
        max-width: 92vw;
        aspect-ratio: 16 / 9;
        border-radius: 14px;
      }

      #giftCloseBtn {
        width: 42px;
        height: 42px;
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <section id="startScreen" class="screen active">
    <div class="coverWrap">
      <img class="coverImage" src="kezdes.png" alt="">
      <button id="playBtn">PLAY</button>
    </div>
  </section>

  <section id="videoScreen" class="screen">
    <video id="mainVideo" playsinline preload="auto" controls></video>
  </section>

  <button id="randomGiftBtn" aria-label="Ajándék videó"></button>

  <div id="mobileEndScreen">
    <div class="mobileEndWrap">
      <img id="mobileEndImage" src="vege.png" alt="">
      <button id="mobileEndBtn" aria-label="Katt ide">
        <img src="kattide.png" alt="Katt ide">
      </button>
    </div>
  </div>

  <div id="giftOverlay" class="giftOverlay">
    <div class="giftBox">
      <button id="giftCloseBtn" aria-label="Bezárás">×</button>
      <video id="giftVideo" playsinline controls preload="auto"></video>
    </div>
  </div>

  <script>
    const isMobile = window.innerWidth <= 700;

    const mainVideo = document.getElementById('mainVideo');
    const playBtn = document.getElementById('playBtn');
    const videoScreen = document.getElementById('videoScreen');
    const randomGiftBtn = document.getElementById('randomGiftBtn');

    const mobileEndScreen = document.getElementById('mobileEndScreen');
    const mobileEndBtn = document.getElementById('mobileEndBtn');

    const giftOverlay = document.getElementById('giftOverlay');
    const giftVideo = document.getElementById('giftVideo');
    const giftCloseBtn = document.getElementById('giftCloseBtn');

    const VIDEO_URL =
      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774195689/utols%C3%B3ok_utols%C3%B3oja_qawodm.mp4?t=" + Date.now();

    const giftVideos = [
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134175/T%C3%B6r%C3%B6k_Norbert_3_vers_a_szerelemr%C5%91l_gm8zu6.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134156/25_%C3%A9vesen---T%C3%B6r%C3%B6k_Norbert_verse_am6wtk.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134159/P%C3%A1rizs_Room_tour_2025_rnchhh.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134153/Legszebb----T%C3%B6r%C3%B6k_Norbert_verse_bq7ori.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134139/%C3%88v%C3%A1mnak_a_boldogs%C3%A1gr%C3%B3l_T%C3%B6r%C3%B6k_Norbert_verse_kwx2lb.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134129/25_H%C3%A1zass%C3%A1gi_%C3%A9vfordul%C3%B3nkra_howpjg.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134104/T%C3%B6r%C3%B6k_Norbert_Mindhal%C3%A1lig_wtvuc8.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134106/%C3%88vfordul%C3%B3_29._aqqeaq.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134099/T%C3%B6r%C3%B6k_Norbert_Ahogy_vagy.._n3ukws.mp4'
    ];

    const GIFT_SHOW_TIME_PC = 257;   // 4:17
    const LOOP_START_PC = 259;       // 4:19
    const LOOP_END_PC = 260;         // 4:20
    const MOBILE_END_TIME = 255;     // 4:15

    let giftBtnVisible = false;
    let loopMode = false;
    let mobileEndShown = false;
    let overlayOpened = false;

    function showScreen(screen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function pickRandomGiftVideo() {
      const randomIndex = Math.floor(Math.random() * giftVideos.length);
      return giftVideos[randomIndex];
    }

    function openGiftOverlay() {
      if (overlayOpened) return;
      overlayOpened = true;

      const chosenVideo = pickRandomGiftVideo();

      mainVideo.pause();
      mainVideo.controls = false;

      giftOverlay.classList.add('show');
      giftOverlay.classList.add('withBg');

      giftVideo.pause();
      giftVideo.src = chosenVideo + (chosenVideo.includes('?') ? '&' : '?') + 't=' + Date.now();
      giftVideo.load();
      giftVideo.play().catch(() => {});
    }

    playBtn.addEventListener('click', async () => {
      showScreen(videoScreen);

      giftBtnVisible = false;
      loopMode = false;
      mobileEndShown = false;
      overlayOpened = false;

      randomGiftBtn.style.display = 'none';
      mobileEndScreen.style.display = 'none';
      giftOverlay.classList.remove('show');
      giftOverlay.classList.remove('withBg');

      giftVideo.pause();
      giftVideo.removeAttribute('src');
      giftVideo.load();

      mainVideo.src = VIDEO_URL + '&start=' + Date.now();
      mainVideo.load();
      mainVideo.currentTime = 0;
      mainVideo.controls = true;

      try {
        await mainVideo.play();
      } catch (e) {
        console.log(e);
      }
    });

    mainVideo.addEventListener('timeupdate', () => {
      if (isMobile) {
        if (!mobileEndShown && mainVideo.currentTime >= MOBILE_END_TIME) {
          mobileEndShown = true;
          mainVideo.controls = false;
          mobileEndScreen.style.display = 'flex';
        }
        return;
      }

      if (!giftBtnVisible && mainVideo.currentTime >= GIFT_SHOW_TIME_PC) {
        randomGiftBtn.style.display = 'block';
        giftBtnVisible = true;
      }

      if (!loopMode && mainVideo.currentTime >= LOOP_START_PC) {
        loopMode = true;
      }

      if (loopMode && mainVideo.currentTime >= LOOP_END_PC) {
        mainVideo.currentTime = LOOP_START_PC;
        mainVideo.play().catch(() => {});
      }
    });

    mobileEndBtn.addEventListener('click', () => {
      mobileEndScreen.style.display = 'none';
      openGiftOverlay();
    });

    randomGiftBtn.addEventListener('click', () => {
      openGiftOverlay();
    });

    giftCloseBtn.addEventListener('click', () => {
      giftVideo.pause();
      giftOverlay.classList.remove('show');
      giftOverlay.classList.remove('withBg');
    });
  </script>

</body>
</html>
