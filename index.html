<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szülinapi projekt</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Georgia, "Times New Roman", serif;
}

.screen {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: #000;
}

.screen.active { display: flex; }

.videoFrame {
  width: min(96vw, 1200px);
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,0.7);
}

#mainVideo, #giftVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  background: #000;
}

.coverWrap {
  position: relative;
  width: min(1100px, 88vw);
}

.coverImage { width: 100%; }

#playBtn {
  position: absolute;
  left: 32%;
  top: 46%;
  transform: translate(-50%, -50%);
  width: 220px;
  height: 130px;
  border: 0;
  background: transparent;
  cursor: pointer;
  color: #fff4d6;
  font-size: 34px;
  font-weight: bold;
}

#mobileEndScreen {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 999999;
  background: #000;
}

.mobileEndWrap {
  position: relative;
  width: 100vw;
  height: 100vh;
}

#mobileEndImage {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.pinPanel {
  position: absolute;
  left: 50%;
  top: 62%;
  transform: translate(-50%, -50%);
  width: min(90vw, 760px);
  padding: 18px;
  text-align: center;
  background: rgba(0,0,0,0.45);
  border-radius: 18px;
}

.pinTitle { color: #fff; margin-bottom: 16px; }

.pinInputs {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.pinDigit {
  width: 58px;
  height: 64px;
  font-size: 34px;
  text-align: center;
}

#continueBtn {
  margin-top: 16px;
  padding: 12px 30px;
  font-size: 20px;
}

#pinMessage {
  margin-top: 14px;
  color: #fff7cf;
  font-size: 22px;
}

/* 🔥 REZGÉS */
@keyframes shake {
  0% { transform: translate(-50%, -50%) translateX(0); }
  20% { transform: translate(-50%, -50%) translateX(-8px); }
  40% { transform: translate(-50%, -50%) translateX(8px); }
  60% { transform: translate(-50%, -50%) translateX(-6px); }
  80% { transform: translate(-50%, -50%) translateX(6px); }
  100% { transform: translate(-50%, -50%) translateX(0); }
}

.pinPanel.shake {
  animation: shake 0.4s ease;
}

@media (max-width: 900px) {
  .pinPanel { top: 66%; }
}
</style>
</head>

<body>

<section id="startScreen" class="screen active">
  <div class="coverWrap">
    <img class="coverImage" src="kezdes.png">
    <button id="playBtn">PLAY</button>
  </div>
</section>

<section id="videoScreen" class="screen">
  <div class="videoFrame">
    <video id="mainVideo" controls></video>
  </div>
</section>

<div id="mobileEndScreen">
  <div class="mobileEndWrap">
    <img id="mobileEndImage" src="vege.png">

    <div id="pinPanel" class="pinPanel">
      <div class="pinTitle">
        Ha Török Éva vagy, írd be a kódot.<br>
        Vagy válaszd a Tovább gombot.
      </div>

      <div class="pinInputs">
        <input id="digit1" class="pinDigit" maxlength="1">
        <input id="digit2" class="pinDigit" maxlength="1">
        <input id="digit3" class="pinDigit" maxlength="1">
        <input id="digit4" class="pinDigit" maxlength="1">
      </div>

      <button id="continueBtn">Tovább</button>
      <div id="pinMessage"></div>
    </div>
  </div>
</div>

<script>
const pinPanel = document.getElementById('pinPanel');
const continueBtn = document.getElementById('continueBtn');
const pinMessage = document.getElementById('pinMessage');

const inputs = [
  digit1, digit2, digit3, digit4
];

let naughtyStep = 0;

function shake() {
  pinPanel.classList.add("shake");
  setTimeout(() => pinPanel.classList.remove("shake"), 400);
}

function wrong() {
  naughtyStep++;

  if (naughtyStep === 1) {
    pinMessage.textContent = "Te kis huncut!";
  } else {
    pinMessage.textContent = "Ha nem az Éva vagy, töröld ki a kódot, hagyd üresen, és menj a Továbbal.";
  }

  shake();
}

continueBtn.onclick = () => {
  const code = inputs.map(i => i.value).join('');

  if (!code) {
    pinMessage.textContent = "";
    alert("Random videó indul 😄");
    return;
  }

  // SZIMULÁCIÓ (itt jönne a worker)
  if (code === "1234") {
    pinMessage.textContent = "Szia Éva ❤️";
  } else {
    wrong();
  }
};

inputs.forEach((input, i) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "");

    if (input.value && i < 3) {
      inputs[i+1].focus();
    }

    pinMessage.textContent = "";
  });
});
</script>

</body>
</html>
