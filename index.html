<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Szülinapi projekt</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, "Times New Roman", serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .screen.active {
      display: flex;
    }

    #startScreen {
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 45%),
        #000;
    }

    .coverWrap {
      position: relative;
      width: min(1100px, 88vw);
      height: min(92vh, 920px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coverImage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      box-shadow: 0 0 50px rgba(0,0,0,0.55);
    }

    #playBtn {
      position: absolute;
      left: 32%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 130px;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #fff4d6;
      font-size: 34px;
      font-weight: bold;
    }

    #mainVideo {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    #randomGiftBtn {
      position: fixed;
      left: 50%;
      top: 57.5%;
      transform: translate(-50%, -50%);
      width: 165px;
      height: 92px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      z-index: 20;
      display: none;
      background: transparent;
    }

    /* MOBIL VÉGKÉP */
    #mobileEndScreen {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 999999;
      background: url('vege.png') center center / cover no-repeat;
    }

    #mobileEndBtn {
      position: absolute;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: min(70vw, 320px);
      height: auto;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    #mobileEndBtn img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* RANDOM AJÁNDÉK OVERLAY */
    .giftOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000000;
      background: #000;
    }

    .giftOverlay.show {
      display: flex;
    }

    .giftOverlay.withBg {
      background: url('hatter.png') center center / cover no-repeat;
    }

    .giftBox {
      position: relative;
      width: min(92vw, 900px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.55);
    }

    #giftVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    #giftCloseBtn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.65);
      color: white;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      z-index: 5;
    }

    @media (max-width: 700px) {
      .giftBox {
        width: 92vw;
        aspect-ratio: 16 / 9;
      }

      #playBtn {
        width: 180px;
        height: 110px;
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <section id="startScreen" class="screen active">
    <div class="coverWrap">
      <img class="coverImage" src="kezdes.png" alt="">
      <button id="playBtn">PLAY</button>
    </div>
  </section>

  <section id="videoScreen" class="screen">
    <video id="mainVideo" playsinline preload="auto" controls></video>
  </section>

  <!-- PC-s ajándék gomb -->
  <button id="randomGiftBtn" aria-label="Ajándék videó"></button>

  <!-- Mobil vége -->
  <div id="mobileEndScreen">
    <button id="mobileEndBtn" aria-label="Katt ide">
      <img src="kattide.png" alt="Katt ide">
    </button>
  </div>

  <!-- Random videó overlay -->
  <div id="giftOverlay" class="giftOverlay">
    <div class="giftBox">
      <button id="giftCloseBtn" aria-label="Bezárás">×</button>
      <video id="giftVideo" playsinline controls preload="auto"></video>
    </div>
  </div>

  <script>
    const isMobile = window.innerWidth <= 700;

    const mainVideo = document.getElementById('mainVideo');
    const playBtn = document.getElementById('playBtn');
    const startScreen = document.getElementById('startScreen');
    const videoScreen = document.getElementById('videoScreen');
    const randomGiftBtn = document.getElementById('randomGiftBtn');

    const mobileEndScreen = document.getElementById('mobileEndScreen');
    const mobileEndBtn = document.getElementById('mobileEndBtn');

    const giftOverlay = document.getElementById('giftOverlay');
    const giftVideo = document.getElementById('giftVideo');
    const giftCloseBtn = document.getElementById('giftCloseBtn');

    const VIDEO_URL =
      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774195689/utols%C3%B3ok_utols%C3%B3oja_qawodm.mp4?t=" + Date.now();

    mainVideo.src = VIDEO_URL;

    /* IDE TEDD BE A 10 RANDOM VIDEÓT */
    const giftVideos = [
      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134175/T%C3%B6r%C3%B6k_Norbert_3_vers_a_szerelemr%C5%91l_gm8zu6.mp4",
      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134156/25_%C3%A9vesen---T%C3%B6r%C3%B6k_Norbert_verse_am6wtk.mp4",

      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1/VIDEO3.mp4",
      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1/VIDEO4.mp4",
      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1/VIDEO5.mp4",
      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1/VIDEO6.mp4",
      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1/VIDEO7.mp4",
      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1/VIDEO8.mp4",
      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1/VIDEO9.mp4",
      "https://res.cloudinary.com/dgcumjeuj/video/upload/v1/VIDEO10.mp4"
    ];

    /* IDŐK */
    const GIFT_SHOW_TIME_PC = 257;   // 4:17
    const LOOP_START_PC = 259;       // 4:19
    const LOOP_END_PC = 260;         // 4:20
    const MOBILE_END_TIME = 255;     // 4:15

    let giftBtnVisible = false;
    let loopMode = false;
    let mobileEndShown = false;

    function showScreen(screen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function resetAll() {
      giftBtnVisible = false;
      loopMode = false;
      mobileEndShown = false;

      randomGiftBtn.style.display = 'none';
      mobileEndScreen.style.display = 'none';
      giftOverlay.classList.remove('show');
      giftOverlay.classList.remove('withBg');

      giftVideo.pause();
      giftVideo.removeAttribute('src');
      giftVideo.load();

      mainVideo.pause();
      mainVideo.src = VIDEO_URL + "&reset=" + Date.now();
      mainVideo.load();
    }

    function playRandomGiftVideo() {
      const randomIndex = Math.floor(Math.random() * giftVideos.length);
      const chosenVideo = giftVideos[randomIndex];

      mainVideo.pause();

      giftOverlay.classList.add('show');
      giftOverlay.classList.add('withBg');

      giftVideo.src = chosenVideo + (chosenVideo.includes("?") ? "&" : "?") + "t=" + Date.now();
      giftVideo.load();
      giftVideo.play().catch(() => {});
    }

    playBtn.addEventListener('click', async () => {
      showScreen(videoScreen);

      giftBtnVisible = false;
      loopMode = false;
      mobileEndShown = false;

      randomGiftBtn.style.display = 'none';
      mobileEndScreen.style.display = 'none';
      giftOverlay.classList.remove('show');
      giftOverlay.classList.remove('withBg');

      giftVideo.pause();
      giftVideo.removeAttribute('src');
      giftVideo.load();

      mainVideo.currentTime = 0;
      mainVideo.controls = true;

      try {
        await mainVideo.play();
      } catch (e) {
        console.log(e);
      }
    });

    mainVideo.addEventListener('timeupdate', () => {
      /* MOBIL */
      if (isMobile) {
        if (!mobileEndShown && mainVideo.currentTime >= MOBILE_END_TIME) {
          mobileEndShown = true;
          mainVideo.pause();
          mainVideo.controls = false;
          mobileEndScreen.style.display = 'block';
        }
        return;
      }

      /* PC */
      if (!giftBtnVisible && mainVideo.currentTime >= GIFT_SHOW_TIME_PC) {
        randomGiftBtn.style.display = 'block';
        giftBtnVisible = true;
      }

      if (!loopMode && mainVideo.currentTime >= LOOP_START_PC) {
        loopMode = true;
      }

      if (loopMode && mainVideo.currentTime >= LOOP_END_PC) {
        mainVideo.currentTime = LOOP_START_PC;
        mainVideo.play().catch(() => {});
      }
    });

    /* MOBIL: katt ide */
    mobileEndBtn.addEventListener('click', () => {
      mobileEndScreen.style.display = 'none';
      playRandomGiftVideo();
    });

    /* PC: random ajándék */
    randomGiftBtn.addEventListener('click', () => {
      playRandomGiftVideo();
    });

    /* Overlay bezárás */
    giftCloseBtn.addEventListener('click', () => {
      giftVideo.pause();
      giftOverlay.classList.remove('show');
      giftOverlay.classList.remove('withBg');
    });

    giftVideo.addEventListener('ended', () => {
      // maradjon a háttér és a videódoboz, ne ugorjon vissza
    });
  </script>

</body>
</html>
