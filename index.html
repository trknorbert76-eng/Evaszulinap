<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Szülinapi projekt</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, "Times New Roman", serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .screen.active {
      display: flex;
    }

    /* 🎬 VIDEÓ DOBOZ */
    .videoFrame {
      width: min(96vw, 1200px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0,0,0,0.7);
    }

    #mainVideo, #giftVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    /* 🎬 START */
    .coverWrap {
      position: relative;
      width: min(1100px, 88vw);
    }

    .coverImage {
      width: 100%;
      display: block;
    }

    #playBtn {
      position: absolute;
      left: 32%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 130px;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #fff4d6;
      font-size: 34px;
      font-weight: bold;
    }

/* 🎯 TELJES KÉPERNYŐS VÉGKÉP */
#mobileEndScreen {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 999999;
  background: #000;
}

.mobileEndWrap {
  position: relative;
  width: 100vw;
  height: 100vh;
}

/* maga a kép kitölti a képernyőt */
#mobileEndImage {
  width: 100%;
  height: 100%;
  object-fit: contain; /* ha vágni akarod: cover */
  display: block;
  background: #000;
}

/* LÁTHATATLAN KATTINTÓ TERÜLET */
#mobileEndBtn {
  position: absolute;
  inset: 0; /* EZ A LÉNYEG → teljes képernyő kattintható */
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 0;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

#mobileEndBtn {
  position: absolute;
  left: 50%;
  top: 58%;
  transform: translate(-50%, -50%);
  width: 45%;
  border: none;
  background: transparent;
  cursor: pointer;
}

#mobileEndBtn img {
  width: 100%;
  display: block;
}

    #mobileEndBtn {
      position: absolute;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: 45%;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    #mobileEndBtn img {
      width: 100%;
      display: block;
    }

    /* 🎁 AJÁNDÉK */
    .giftOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000000;
    }

    .giftOverlay.show {
      display: flex;
    }

    .giftOverlay.withBg {
      background: url('hatter.png') center/cover no-repeat;
    }

    .giftBox {
      position: relative;
      width: min(92vw, 900px);
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 40px rgba(0,0,0,0.65);
    }

    #giftCloseBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      font-size: 26px;
      cursor: pointer;
      z-index: 1000001;
    }
  </style>
</head>

<body>

<!-- START -->
<section id="startScreen" class="screen active">
  <div class="coverWrap">
    <img class="coverImage" src="kezdes.png" alt="">
    <button id="playBtn" type="button">PLAY</button>
  </div>
</section>

<!-- VIDEÓ -->
<section id="videoScreen" class="screen">
  <div class="videoFrame">
    <video id="mainVideo" playsinline webkit-playsinline preload="auto" controls></video>
  </div>
</section>

<!-- MOBIL VÉGE -->
<!-- MOBIL VÉGE -->
<div id="mobileEndScreen">
  <div class="mobileEndWrap">
    <img id="mobileEndImage" src="vege.png" alt="">
    <button id="mobileEndBtn" type="button" aria-label="Ajándék videó indítása"></button>
  </div>
</div>

<!-- AJÁNDÉK -->
<div id="giftOverlay" class="giftOverlay">
  <button id="giftCloseBtn" type="button">×</button>
  <div class="giftBox">
    <video id="giftVideo" playsinline webkit-playsinline controls></video>
  </div>
</div>

<script>
  const mainVideo = document.getElementById('mainVideo');
  const playBtn = document.getElementById('playBtn');
  const startScreen = document.getElementById('startScreen');
  const videoScreen = document.getElementById('videoScreen');

  const mobileEndScreen = document.getElementById('mobileEndScreen');
  const mobileEndBtn = document.getElementById('mobileEndBtn');

  const giftOverlay = document.getElementById('giftOverlay');
  const giftVideo = document.getElementById('giftVideo');
  const giftCloseBtn = document.getElementById('giftCloseBtn');

  const VIDEO_URL = "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774195689/utols%C3%B3ok_utols%C3%B3oja_qawodm.mp4";

  const giftVideos = [
    'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134175/T%C3%B6r%C3%B6k_Norbert_3_vers_a_szerelemr%C5%91l_gm8zu6.mp4',
    'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134156/25_%C3%A9vesen---T%C3%B6r%C3%B6k_Norbert_verse_am6wtk.mp4',
    'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134159/P%C3%A1rizs_Room_tour_2025_rnchhh.mp4',
    'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134153/Legszebb----T%C3%B6r%C3%B6k_Norbert_verse_bq7ori.mp4',
    'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134139/%C3%88v%C3%A1mnak_a_boldogs%C3%A1gr%C3%B3l_T%C3%B6r%C3%B6k_Norbert_verse_kwx2lb.mp4',
    'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134129/25_H%C3%A1zass%C3%A1gi_%C3%A9vfordul%C3%B3nkra_howpjg.mp4',
    'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134104/T%C3%B6r%C3%B6k_Norbert_Mindhal%C3%A1lig_wtvuc8.mp4',
    'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134106/%C3%88vfordul%C3%B3_29._aqqeaq.mp4',
    'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134099/T%C3%B6r%C3%B6k_Norbert_Ahogy_vagy.._n3ukws.mp4'
  ];

  const END_TIME = 255; // 4:15
  let endShown = false;

  function showScreen(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
  }

  function getRandomGiftVideo() {
    const index = Math.floor(Math.random() * giftVideos.length);
    return giftVideos[index];
  }

  playBtn.onclick = async () => {
    endShown = false;
    mobileEndScreen.style.display = 'none';
    giftOverlay.classList.remove('show', 'withBg');
    giftVideo.pause();
    giftVideo.removeAttribute('src');
    giftVideo.load();

    videoScreen.style.display = 'flex';
    showScreen(videoScreen);

    mainVideo.src = VIDEO_URL + "?t=" + Date.now();
    mainVideo.load();

    try {
      await mainVideo.play();
    } catch (e) {
      console.log("Main video play hiba:", e);
    }
  };

  mainVideo.addEventListener('timeupdate', () => {
    if (!endShown && mainVideo.currentTime >= END_TIME) {
      endShown = true;
      mainVideo.pause();

      videoScreen.classList.remove('active');
      videoScreen.style.display = 'none';

      mobileEndScreen.style.display = 'flex';
    }
  });

  mobileEndBtn.onclick = async () => {
    const randomVideo = getRandomGiftVideo();

    mobileEndScreen.style.display = 'none';

    giftOverlay.classList.add('show');
    giftOverlay.classList.add('withBg');

    giftVideo.pause();
    giftVideo.src = randomVideo + "?t=" + Date.now();
    giftVideo.load();

    try {
      await giftVideo.play();
    } catch (e) {
      console.log("Gift video play hiba:", e);
    }
  };

 giftCloseBtn.onclick = () => {
  giftVideo.pause();
  giftVideo.currentTime = 0;
  giftOverlay.classList.remove('show');
  giftOverlay.classList.remove('withBg');
  showScreen(startScreen);
};

giftVideo.addEventListener('ended', () => {
  giftVideo.currentTime = 0;
  giftOverlay.classList.remove('show');
  giftOverlay.classList.remove('withBg');
  showScreen(startScreen);
});
</script>

</body>
</html>
