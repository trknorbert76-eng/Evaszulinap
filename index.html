<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szülinapi projekt</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Georgia, "Times New Roman", serif;
}

.screen {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
}

.screen.active { display: flex; }

.videoFrame {
  width: min(96vw, 1200px);
  aspect-ratio: 16 / 9;
  border-radius: 18px;
  overflow: hidden;
}

#mainVideo, #giftVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.coverWrap {
  position: relative;
  width: min(1100px, 88vw);
}

.coverImage { width: 100%; }

#playBtn {
  position: absolute;
  left: 32%;
  top: 46%;
  transform: translate(-50%, -50%);
  width: 220px;
  height: 130px;
  border: 0;
  background: transparent;
  cursor: pointer;
  color: #fff;
  font-size: 34px;
}

#mobileEndScreen {
  position: fixed;
  inset: 0;
  display: none;
  background: #000;
}

.mobileEndWrap {
  width: 100vw;
  height: 100vh;
  position: relative;
}

#mobileEndImage {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.pinPanel {
  position: absolute;
  left: 50%;
  top: 62%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.5);
  padding: 18px;
  border-radius: 18px;
  text-align: center;
}

.pinInputs {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.pinDigit {
  width: 60px;
  height: 60px;
  font-size: 30px;
  text-align: center;
}

#continueBtn {
  margin-top: 14px;
  padding: 10px 20px;
}

#pinMessage {
  margin-top: 12px;
  color: #fff;
}

/* 🔥 REZGÉS */
@keyframes shake {
  0% { transform: translate(-50%, -50%) translateX(0); }
  25% { transform: translate(-50%, -50%) translateX(-8px); }
  50% { transform: translate(-50%, -50%) translateX(8px); }
  75% { transform: translate(-50%, -50%) translateX(-6px); }
  100% { transform: translate(-50%, -50%) translateX(0); }
}

.pinPanel.shake {
  animation: shake 0.4s ease;
}
</style>
</head>

<body>

<section id="startScreen" class="screen active">
  <div class="coverWrap">
    <img class="coverImage" src="kezdes.png">
    <button id="playBtn">PLAY</button>
  </div>
</section>

<section id="videoScreen" class="screen">
  <div class="videoFrame">
    <video id="mainVideo" controls></video>
  </div>
</section>

<div id="mobileEndScreen">
  <div class="mobileEndWrap">
    <img id="mobileEndImage" src="vege.png">

    <div id="pinPanel" class="pinPanel">
      <div>
        Ha Török Éva vagy, írd be a kódot.<br>
        Vagy válaszd a Tovább gombot.
      </div>

      <div class="pinInputs">
        <input id="digit1" class="pinDigit" maxlength="1">
        <input id="digit2" class="pinDigit" maxlength="1">
        <input id="digit3" class="pinDigit" maxlength="1">
        <input id="digit4" class="pinDigit" maxlength="1">
      </div>

      <button id="continueBtn">Tovább</button>
      <div id="pinMessage"></div>
    </div>
  </div>
</div>

<script>
const WORKER_URL = "https://shy-hall-764d.trknorbert76.workers.dev";

const digit1 = document.getElementById('digit1');
const digit2 = document.getElementById('digit2');
const digit3 = document.getElementById('digit3');
const digit4 = document.getElementById('digit4');
const inputs = [digit1, digit2, digit3, digit4];

const continueBtn = document.getElementById('continueBtn');
const pinMessage = document.getElementById('pinMessage');
const pinPanel = document.getElementById('pinPanel');

let naughtyStep = 0;

function shake() {
  pinPanel.classList.add("shake");
  setTimeout(() => pinPanel.classList.remove("shake"), 400);
}

function wrong() {
  naughtyStep++;

  if (naughtyStep === 1) {
    pinMessage.textContent = "Te kis huncut!";
  } else {
    pinMessage.textContent = "Ha nem az Éva vagy, töröld ki a kódot, hagyd üresen, és menj a Továbbal.";
  }

  shake();
}

continueBtn.onclick = async () => {
  const code = inputs.map(i => i.value).join('').trim();

  if (!code) {
    pinMessage.textContent = "";
    alert("Random videó indul 😄"); // ide jöhet a saját videó hívásod
    return;
  }

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ code })
    });

    const data = await res.json();

    if (data.ok && data.video) {
      pinMessage.textContent = "Szia Éva, boldog szülinapot! ❤️";
      naughtyStep = 0;

      setTimeout(() => {
        window.location.href = data.video;
      }, 1200);
    } else {
      wrong();
    }

  } catch (err) {
    console.log(err);
    wrong();
  }
};

inputs.forEach((input, i) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "");

    if (input.value && i < 3) {
      inputs[i + 1].focus();
    }

    pinMessage.textContent = "";
  });
});
</script>

</body>
</html>
