<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Szülinapi videó</title>
  <meta property="og:image" content="https://trknorbert76-eng.github.io/Evaszulinap/intro.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://trknorbert76-eng.github.io/Evaszulinap/">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, "Times New Roman", serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .screen.active { display: flex; }

    .videoFrame {
      width: min(96vw, 1200px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0,0,0,0.7);
    }

    #mainVideo, #giftVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .coverWrap {
      position: relative;
      width: min(1100px, 88vw);
    }

    .coverImage {
      width: 100%;
      display: block;
    }

    #playBtn {
      position: absolute;
      left: 32%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 130px;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #fff4d6;
      font-size: 34px;
      font-weight: bold;
    }

    #mobileEndScreen {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 999999;
      background: #000;
    }

    .mobileEndWrap {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #mobileEndImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
      pointer-events: none;
    }

    .pinPanel {
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(-50%, -50%);
      width: min(90vw, 760px);
      padding: 18px 20px 20px;
      text-align: center;
      background: rgba(0,0,0,0.45);
      border-radius: 18px;
      backdrop-filter: blur(3px);
      z-index: 20;
    }

    .pinTitle {
      color: #fff;
      font-size: clamp(18px, 2vw, 28px);
      line-height: 1.35;
      margin-bottom: 16px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }

    .pinInputs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pinDigit {
      width: 58px;
      height: 64px;
      text-align: center;
      font-size: 34px;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 12px;
      background: rgba(255,255,255,0.95);
      color: #111;
      outline: none;
    }

    .pinDigit:focus {
      border-color: #ffd27a;
      box-shadow: 0 0 0 3px rgba(255,210,122,0.25);
    }

    .pinDigit,
    #continueBtn,
    #pinMessage,
    .pinTitle,
    .pinInputs,
    .pinActions {
      position: relative;
      z-index: 21;
    }

    .pinActions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    #continueBtn {
      border: none;
      border-radius: 12px;
      padding: 12px 30px;
      font-size: 20px;
      cursor: pointer;
      background: rgba(255,255,255,0.92);
      color: #111;
      font-weight: bold;
    }

    #clearBtn {
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 20px;
      cursor: pointer;
      background: rgba(255,255,255,0.75);
      color: #111;
      font-weight: bold;
    }

    #pinMessage {
      min-height: 28px;
      margin-top: 14px;
      color: #fff7cf;
      font-size: clamp(18px, 1.8vw, 26px);
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }

    .giftOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000000;
      padding: 18px;
    }

    .giftOverlay.show { display: flex; }

    .giftOverlay.withBg {
      background: url('hatter.png') center/cover no-repeat;
    }

    .giftLayout {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 18px;
      width: min(95vw, 1400px);
    }

    .giftBox {
      width: min(68vw, 920px);
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      flex-shrink: 0;
    }

    .giftPlaylistWrap {
      width: min(26vw, 340px);
      flex-shrink: 0;
    }

    .playlistToggle {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: rgba(255,255,255,0.92);
      color: #111;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .giftPlaylist {
      display: none;
      margin-top: 10px;
      max-height: 62vh;
      overflow-y: auto;
      padding: 14px;
      border-radius: 16px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .giftPlaylist.show {
      display: block;
    }

    .giftPlaylistTitle {
      color: #fff6d8;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    .giftList {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .giftItem {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      font-size: 16px;
      line-height: 1.35;
      background: rgba(255,255,255,0.92);
      color: #111;
      font-weight: bold;
    }

    .giftItem.active {
      background: #ffe7a8;
      box-shadow: 0 0 0 2px rgba(255,214,122,0.6) inset;
    }

    #giftCloseBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      font-size: 26px;
      cursor: pointer;
      z-index: 1000001;
    }

    @keyframes shake {
      0%   { transform: translate(-50%, -50%) translateX(0); }
      20%  { transform: translate(-50%, -50%) translateX(-8px); }
      40%  { transform: translate(-50%, -50%) translateX(8px); }
      60%  { transform: translate(-50%, -50%) translateX(-6px); }
      80%  { transform: translate(-50%, -50%) translateX(6px); }
      100% { transform: translate(-50%, -50%) translateX(0); }
    }

    .pinPanel.shake {
      animation: shake 0.4s ease;
    }

    @media (max-width: 900px) {
      .pinPanel {
        top: 66%;
        width: min(94vw, 620px);
        padding: 14px 14px 16px;
      }

      .pinDigit {
        width: 50px;
        height: 58px;
        font-size: 28px;
      }

      .giftLayout {
        flex-direction: column;
        align-items: center;
        width: 100%;
        gap: 12px;
        padding-top: 50px;
      }

      .giftBox {
        width: min(94vw, 760px);
      }

      .giftPlaylistWrap {
        width: min(94vw, 760px);
      }

      .playlistToggle {
        font-size: 17px;
        padding: 12px 14px;
      }

      .giftPlaylist {
        max-height: 32vh;
        padding: 12px;
      }

      .giftPlaylistTitle {
        font-size: 18px;
      }

      .giftItem {
        font-size: 15px;
        padding: 10px 12px;
      }

      #giftCloseBtn {
        top: 10px;
        right: 10px;
        width: 42px;
        height: 42px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <section id="startScreen" class="screen active">
    <div class="coverWrap">
      <img class="coverImage" src="kezdes.png" alt="">
      <button id="playBtn" type="button">PLAY</button>
    </div>
  </section>

  <section id="videoScreen" class="screen">
    <div class="videoFrame">
      <video id="mainVideo" playsinline webkit-playsinline preload="auto" controls></video>
    </div>
  </section>

  <div id="mobileEndScreen">
    <div class="mobileEndWrap">
      <img id="mobileEndImage" src="vege2.png" alt="">
      <div id="pinPanel" class="pinPanel">
        <div class="pinTitle">
          Ha Török Éva vagy, írd be a kódot.<br>
          Vagy válaszd a Tovább gombot.
        </div>

        <div class="pinInputs">
          <input id="digit1" class="pinDigit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
          <input id="digit2" class="pinDigit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
          <input id="digit3" class="pinDigit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
          <input id="digit4" class="pinDigit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
        </div>

        <div class="pinActions">
          <button id="clearBtn" type="button">Törlés</button>
          <button id="continueBtn" type="button">Tovább</button>
        </div>

        <div id="pinMessage"></div>
      </div>
    </div>
  </div>

  <div id="giftOverlay" class="giftOverlay">
    <button id="giftCloseBtn" type="button">×</button>

    <div class="giftLayout">
      <div class="giftBox">
        <video id="giftVideo" playsinline webkit-playsinline controls></video>
      </div>

      <aside class="giftPlaylistWrap">
        <button id="playlistToggle" type="button" class="playlistToggle">
          Videók listája ▼
        </button>

        <div id="giftPlaylist" class="giftPlaylist">
          <div class="giftPlaylistTitle">Választható videók</div>
          <div id="giftList" class="giftList"></div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const mainVideo = document.getElementById('mainVideo');
    const playBtn = document.getElementById('playBtn');
    const startScreen = document.getElementById('startScreen');
    const videoScreen = document.getElementById('videoScreen');
    const mobileEndScreen = document.getElementById('mobileEndScreen');
    const pinPanel = document.getElementById('pinPanel');
    const continueBtn = document.getElementById('continueBtn');
    const clearBtn = document.getElementById('clearBtn');
    const pinMessage = document.getElementById('pinMessage');
    const digit1 = document.getElementById('digit1');
    const digit2 = document.getElementById('digit2');
    const digit3 = document.getElementById('digit3');
    const digit4 = document.getElementById('digit4');
    const pinInputs = [digit1, digit2, digit3, digit4];
    const giftOverlay = document.getElementById('giftOverlay');
    const giftVideo = document.getElementById('giftVideo');
    const giftCloseBtn = document.getElementById('giftCloseBtn');
    const giftList = document.getElementById('giftList');
    const playlistToggle = document.getElementById('playlistToggle');
    const giftPlaylist = document.getElementById('giftPlaylist');

    const VIDEO_URL = "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774195689/utols%C3%B3ok_utols%C3%B3oja_qawodm.mp4";
    const WORKER_URL = "https://shy-hall-764d.trknorbert76.workers.dev";

    const SUPABASE_URL = "https://hhysuxfwdjwlxtmlxnrv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4Btoi0wsypr48xQH31RMaQ_r1YrPpsv";
    const SUPABASE_TABLE = "birthday_stats";

    const giftVideos = [
      {
        title: "💛 Három vers a szerelemről",
        url: "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134175/T%C3%B6r%C3%B6k_Norbert_3_vers_a_szerelemr%C5%91l_gm8zu6.mp4"
      },
      {
        title: "🌿 25 évesen",
        url: "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134156/25_%C3%A9vesen---T%C3%B6r%C3%B6k_Norbert_verse_am6wtk.mp4"
      },
      {
        title: "🗼 Párizs – Room tour",
        url: "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134159/P%C3%A1rizs_Room_tour_2025_rnchhh.mp4"
      },
      {
        title: "✨ Legszebb",
        url: "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134153/Legszebb----T%C3%B6r%C3%B6k_Norbert_verse_bq7ori.mp4"
      },
      {
        title: "💌 Évámnak a boldogságról",
        url: "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134139/%C3%88v%C3%A1mnak_a_boldogs%C3%A1gr%C3%B3l_T%C3%B6r%C3%B6k_Norbert_verse_kwx2lb.mp4"
      },
      {
        title: "🎂 Márciusi hasonlat",
        url: "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774650954/M%C3%A1rciusi_hasonlat_qnojb1.mp4"
      },
      {
        title: "💍 25. házassági évfordulónkra",
        url: "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134129/25_H%C3%A1zass%C3%A1gi_%C3%A9vfordul%C3%B3nkra_howpjg.mp4"
      },
      {
        title: "🔥 Mindhalálig",
        url: "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134104/T%C3%B6r%C3%B6k_Norbert_Mindhal%C3%A1lig_wtvuc8.mp4"
      },
      {
        title: "🕊️ 29. házassági évfordulónkra",
        url: "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134106/%C3%88vfordul%C3%B3_29._aqqeaq.mp4"
      },
      {
        title: "🌙 Ahogy vagy…",
        url: "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134099/T%C3%B6r%C3%B6k_Norbert_Ahogy_vagy.._n3ukws.mp4"
      }
    ];

    const END_TIME = 255;
    let endShown = false;
    let naughtyStep = 0;
    let giftEndedNaturally = false;

    async function trackEvent(eventName) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({ event: eventName })
        });
      } catch (err) {
        console.log("Supabase track hiba:", err);
      }
    }

    function showScreen(screen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function getRandomGiftVideoData() {
      const index = Math.floor(Math.random() * giftVideos.length);
      return {
        item: giftVideos[index],
        index: index
      };
    }

    function renderGiftList(activeIndex = null) {
      giftList.innerHTML = "";

      giftVideos.forEach((video, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "giftItem" + (index === activeIndex ? " active" : "");
        btn.textContent = video.title;

        btn.onclick = async () => {
          await startSelectedVideo(video.url, "manual", index);
        };

        giftList.appendChild(btn);
      });
    }

    function resetPinUI() {
      pinInputs.forEach(input => input.value = "");
      pinMessage.textContent = "";
      pinPanel.style.display = "block";
      naughtyStep = 0;
    }

    async function exitAnyFullscreen() {
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
        }
      } catch (e) {
        console.log("document fullscreen exit hiba:", e);
      }

      try {
        if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      } catch (e) {
        console.log("webkit fullscreen exit hiba:", e);
      }

      try {
        if (mainVideo.webkitDisplayingFullscreen && mainVideo.webkitExitFullscreen) {
          mainVideo.webkitExitFullscreen();
        }
      } catch (e) {
        console.log("video fullscreen exit hiba:", e);
      }
    }

    async function startSelectedVideo(videoUrl, mode, index = null) {
      pinPanel.style.display = "none";
      mobileEndScreen.style.display = "none";
      giftOverlay.classList.add('show');
      giftOverlay.classList.add('withBg');

      renderGiftList(index);

      if (mode === "random") {
        giftPlaylist.classList.remove("show");
        playlistToggle.textContent = "Videók listája ▼";
      } else {
        giftPlaylist.classList.add("show");
        playlistToggle.textContent = "Videók listája ▲";
      }

      giftEndedNaturally = false;

      giftVideo.pause();
      giftVideo.src = videoUrl + "?t=" + Date.now();
      giftVideo.load();

      await trackEvent("gift_video_started_total");

      if (videoUrl.includes("M%C3%A1rciusi_hasonlat") || videoUrl.includes("Marciusi_hasonlat")) {
        await trackEvent("video_marciusi_hasonlat");
      }

      if (mode === "random") {
        await trackEvent("gift_video_started_random");
        if (index !== null) {
          await trackEvent(`gift_video_item_${index + 1}`);
        }
      }

      if (mode === "pin") {
        await trackEvent("gift_video_started_pin");
        await trackEvent("gift_video_item_pin");
      }

      if (mode === "manual") {
        await trackEvent("gift_video_started_manual");
        if (index !== null) {
          await trackEvent(`gift_video_manual_item_${index + 1}`);
        }
      }

      try {
        await giftVideo.play();
      } catch (e) {
        console.log("Video play hiba:", e);
      }
    }

    async function handlePinSubmit() {
      const code = pinInputs.map(input => input.value).join('').trim();

      if (!code) {
        await trackEvent("pin_empty_continue");
        const selected = getRandomGiftVideoData();
        startSelectedVideo(selected.item.url, "random", selected.index);
        return;
      }

      await trackEvent("pin_attempt_total");

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });

        const data = await res.json();

        if (data.ok && data.video) {
          await trackEvent("pin_correct");

          pinMessage.textContent = "Szia Éva, boldog szülinapot!";
          naughtyStep = 0;

          setTimeout(() => {
            pinMessage.textContent = "";
            startSelectedVideo(data.video, "pin");
          }, 1200);
        } else {
          await trackEvent("pin_wrong");

          naughtyStep++;
          if (naughtyStep === 1) {
            pinMessage.textContent = "Te kis huncut!";
            pinPanel.classList.add("shake");
            setTimeout(() => pinPanel.classList.remove("shake"), 400);
          } else {
            pinMessage.textContent = "Ha nem az Éva vagy, töröld ki a kódot, hagyd üresen, és menj a Továbbal.";
            pinPanel.classList.add("shake");
            setTimeout(() => pinPanel.classList.remove("shake"), 400);
          }
        }
      } catch (err) {
        console.log("Worker hiba:", err);
        await trackEvent("pin_wrong");

        naughtyStep++;
        if (naughtyStep === 1) {
          pinMessage.textContent = "Te kis huncut!";
          pinPanel.classList.add("shake");
          setTimeout(() => pinPanel.classList.remove("shake"), 400);
        } else {
          pinMessage.textContent = "Ha nem az Éva vagy, töröld ki a kódot, hagyd üresen, és menj a Továbbal.";
          pinPanel.classList.add("shake");
          setTimeout(() => pinPanel.classList.remove("shake"), 400);
        }
      }
    }

    pinInputs.forEach((input, index) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);

        if (pinInputs.every(i => i.value === "")) {
          naughtyStep = 0;
          pinMessage.textContent = "";
        }

        if (input.value && index < pinInputs.length - 1) {
          pinInputs[index + 1].focus();
        }
      });

      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && index > 0) {
          pinInputs[index - 1].focus();
        }
        if (e.key === "Enter") {
          handlePinSubmit();
        }
      });
    });

    playlistToggle.onclick = () => {
      giftPlaylist.classList.toggle("show");
      playlistToggle.textContent = giftPlaylist.classList.contains("show")
        ? "Videók listája ▲"
        : "Videók listája ▼";
    };

    continueBtn.onclick = () => {
      handlePinSubmit();
    };

    clearBtn.onclick = async () => {
      pinInputs.forEach(input => input.value = "");
      pinMessage.textContent = "";
      naughtyStep = 0;
      digit1.focus();
    };

    playBtn.onclick = async () => {
      endShown = false;
      mobileEndScreen.style.display = 'none';
      giftOverlay.classList.remove('show', 'withBg');
      giftPlaylist.classList.remove("show");
      playlistToggle.textContent = "Videók listája ▼";

      giftVideo.pause();
      giftVideo.removeAttribute('src');
      giftVideo.load();

      resetPinUI();

      videoScreen.style.display = 'flex';
      showScreen(videoScreen);

      mainVideo.src = VIDEO_URL + "?t=" + Date.now();
      mainVideo.load();

      await trackEvent("main_video_start");

      try {
        await mainVideo.play();
      } catch (e) {
        console.log("Main video play hiba:", e);
      }
    };

    mainVideo.addEventListener('timeupdate', async () => {
      if (!endShown && mainVideo.currentTime >= END_TIME) {
        endShown = true;
        mainVideo.pause();

        await trackEvent("main_video_end");

        await exitAnyFullscreen();

        videoScreen.classList.remove('active');
        videoScreen.style.display = 'none';

        resetPinUI();
        mobileEndScreen.style.display = 'block';

        setTimeout(() => {
          digit1.focus();
        }, 300);
      }
    });

    giftCloseBtn.onclick = async () => {
      giftVideo.pause();
      giftVideo.currentTime = 0;
      giftVideo.removeAttribute('src');
      giftVideo.load();
      giftOverlay.classList.remove('show', 'withBg');
      giftPlaylist.classList.remove("show");
      playlistToggle.textContent = "Videók listája ▼";
      showScreen(startScreen);
    };

    giftVideo.addEventListener('ended', async () => {
      giftEndedNaturally = true;
      giftVideo.currentTime = 0;
      giftVideo.removeAttribute('src');
      giftVideo.load();
      giftOverlay.classList.remove('show', 'withBg');
      giftPlaylist.classList.remove("show");
      playlistToggle.textContent = "Videók listája ▼";
      showScreen(startScreen);
    });

    pinPanel.addEventListener('click', () => {
      setTimeout(() => {
        digit1.focus();
      }, 50);
    });
  </script>
</body>
</html>
