<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Szülinapi videó</title>
<meta property="og:image" content="https://trknorbert76-eng.github.io/Evaszulinap/intro.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://trknorbert76-eng.github.io/Evaszulinap/">

<meta name="twitter:card" content="summary_large_image">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, "Times New Roman", serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .screen.active { display: flex; }

    .videoFrame {
      width: min(96vw, 1200px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0,0,0,0.7);
    }

    #mainVideo, #giftVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .coverWrap {
      position: relative;
      width: min(1100px, 88vw);
    }

    .coverImage {
      width: 100%;
      display: block;
    }

    #playBtn {
      position: absolute;
      left: 32%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 130px;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #fff4d6;
      font-size: 34px;
      font-weight: bold;
    }

    #mobileEndScreen {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 999999;
      background: #000;
    }

    .mobileEndWrap {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

 #mobileEndImage {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  background: #000;
  pointer-events: none;
}

    .pinPanel {
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(-50%, -50%);
      width: min(90vw, 760px);
      padding: 18px 20px 20px;
      text-align: center;
      background: rgba(0,0,0,0.45);
      border-radius: 18px;
      backdrop-filter: blur(3px);
      z-index: 20;
    }

    .pinTitle {
      color: #fff;
      font-size: clamp(18px, 2vw, 28px);
      line-height: 1.35;
      margin-bottom: 16px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }

    .pinInputs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pinDigit {
      width: 58px;
      height: 64px;
      text-align: center;
      font-size: 34px;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 12px;
      background: rgba(255,255,255,0.95);
      color: #111;
      outline: none;
    }

    .pinDigit:focus {
      border-color: #ffd27a;
      box-shadow: 0 0 0 3px rgba(255,210,122,0.25);
    }
    .pinDigit,
#continueBtn,
#pinMessage,
.pinTitle,
.pinInputs,
.pinActions {
  position: relative;
  z-index: 21;
}
 .pinActions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    #continueBtn {
      border: none;
      border-radius: 12px;
      padding: 12px 30px;
      font-size: 20px;
      cursor: pointer;
      background: rgba(255,255,255,0.92);
      color: #111;
      font-weight: bold;
    }

    #pinMessage {
      min-height: 28px;
      margin-top: 14px;
      color: #fff7cf;
      font-size: clamp(18px, 1.8vw, 26px);
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }

    .giftOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000000;
    }

    .giftOverlay.show { display: flex; }

    .giftOverlay.withBg {
      background: url('hatter.png') center/cover no-repeat;
    }

    .giftBox {
      position: absolute;
      left: 10%;
      top: 22%;
      width: min(45vw, 460px);
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }

    #giftCloseBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      font-size: 26px;
      cursor: pointer;
      z-index: 1000001;
    }

    @keyframes shake {
      0%   { transform: translate(-50%, -50%) translateX(0); }
      20%  { transform: translate(-50%, -50%) translateX(-8px); }
      40%  { transform: translate(-50%, -50%) translateX(8px); }
      60%  { transform: translate(-50%, -50%) translateX(-6px); }
      80%  { transform: translate(-50%, -50%) translateX(6px); }
      100% { transform: translate(-50%, -50%) translateX(0); }
    }

    .pinPanel.shake {
      animation: shake 0.4s ease;
    }

    @media (max-width: 900px) {
      .pinPanel {
        top: 66%;
        width: min(94vw, 620px);
        padding: 14px 14px 16px;
      }

      .pinDigit {
        width: 50px;
        height: 58px;
        font-size: 28px;
      }

      .giftBox {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(90vw, 760px);
      }
    }
  </style>
</head>
<body>

  <section id="startScreen" class="screen active">
    <div class="coverWrap">
      <img class="coverImage" src="kezdes.png" alt="">
      <button id="playBtn" type="button">PLAY</button>
    </div>
  </section>

  <section id="videoScreen" class="screen">
    <div class="videoFrame">
      <video id="mainVideo" playsinline webkit-playsinline preload="auto" controls></video>
    </div>
  </section>

  <div id="mobileEndScreen">
    <div class="mobileEndWrap">
      <img id="mobileEndImage" src="vege2.png" alt="">
      <div id="pinPanel" class="pinPanel">
        <div class="pinTitle">
          Ha Török Éva vagy, írd be a kódot.<br>
          Vagy válaszd a Tovább gombot.
        </div>

        <div class="pinInputs">
          <input id="digit1" class="pinDigit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
          <input id="digit2" class="pinDigit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
          <input id="digit3" class="pinDigit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
          <input id="digit4" class="pinDigit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
        </div>

        <div class="pinActions">
          <button id="continueBtn" type="button">Tovább</button>
        </div>

        <div id="pinMessage"></div>
      </div>
    </div>
  </div>

  <div id="giftOverlay" class="giftOverlay">
    <button id="giftCloseBtn" type="button">×</button>
    <div class="giftBox">
      <video id="giftVideo" playsinline webkit-playsinline controls></video>
    </div>
  </div>

  <script>
    const mainVideo = document.getElementById('mainVideo');
    const playBtn = document.getElementById('playBtn');
    const startScreen = document.getElementById('startScreen');
    const videoScreen = document.getElementById('videoScreen');
    const mobileEndScreen = document.getElementById('mobileEndScreen');
    const pinPanel = document.getElementById('pinPanel');
    const continueBtn = document.getElementById('continueBtn');
    const pinMessage = document.getElementById('pinMessage');
    const digit1 = document.getElementById('digit1');
    const digit2 = document.getElementById('digit2');
    const digit3 = document.getElementById('digit3');
    const digit4 = document.getElementById('digit4');
    const pinInputs = [digit1, digit2, digit3, digit4];
    const giftOverlay = document.getElementById('giftOverlay');
    const giftVideo = document.getElementById('giftVideo');
    const giftCloseBtn = document.getElementById('giftCloseBtn');

    const VIDEO_URL = "https://res.cloudinary.com/dgcumjeuj/video/upload/v1774195689/utols%C3%B3ok_utols%C3%B3oja_qawodm.mp4";
    const WORKER_URL = "https://shy-hall-764d.trknorbert76.workers.dev";

    const giftVideos = [
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134175/T%C3%B6r%C3%B6k_Norbert_3_vers_a_szerelemr%C5%91l_gm8zu6.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134156/25_%C3%A9vesen---T%C3%B6r%C3%B6k_Norbert_verse_am6wtk.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134159/P%C3%A1rizs_Room_tour_2025_rnchhh.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134153/Legszebb----T%C3%B6r%C3%B6k_Norbert_verse_bq7ori.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134139/%C3%88v%C3%A1mnak_a_boldogs%C3%A1gr%C3%B3l_T%C3%B6r%C3%B6k_Norbert_verse_kwx2lb.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134129/25_H%C3%A1zass%C3%A1gi_%C3%A9vfordul%C3%B3nkra_howpjg.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134104/T%C3%B6r%C3%B6k_Norbert_Mindhal%C3%A1lig_wtvuc8.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134106/%C3%88vfordul%C3%B3_29._aqqeaq.mp4',
      'https://res.cloudinary.com/dgcumjeuj/video/upload/v1774134099/T%C3%B6r%C3%B6k_Norbert_Ahogy_vagy.._n3ukws.mp4'
    ];

    const END_TIME = 255;
    let endShown = false;
    let naughtyStep = 0;

    function showScreen(screen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function getRandomGiftVideo() {
      const index = Math.floor(Math.random() * giftVideos.length);
      return giftVideos[index];
    }

    function resetPinUI() {
      pinInputs.forEach(input => input.value = "");
      pinMessage.textContent = "";
      pinPanel.style.display = "block";
      naughtyStep = 0;
    }
function exitFullscreenMobile() {
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (!isMobile) return;

  try {
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen();
    }
  } catch (e) {
    console.log("document fullscreen exit hiba:", e);
  }

  try {
    if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  } catch (e) {
    console.log("webkit fullscreen exit hiba:", e);
  }

  try {
    if (mainVideo.webkitDisplayingFullscreen && mainVideo.webkitExitFullscreen) {
      mainVideo.webkitExitFullscreen();
    }
  } catch (e) {
    console.log("video fullscreen exit hiba:", e);
  }
}
    async function startSelectedVideo(videoUrl) {
      pinPanel.style.display = "none";
      mobileEndScreen.style.display = "none";
      giftOverlay.classList.add('show');
      giftOverlay.classList.add('withBg');

      giftVideo.pause();
      giftVideo.src = videoUrl + "?t=" + Date.now();
      giftVideo.load();

      try {
        await giftVideo.play();
      } catch (e) {
        console.log("Video play hiba:", e);
      }
    }

    async function handlePinSubmit() {
      const code = pinInputs.map(input => input.value).join('').trim();

      if (!code) {
        pinMessage.textContent = "";
        startSelectedVideo(getRandomGiftVideo());
        return;
      }

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });

        const data = await res.json();

        if (data.ok && data.video) {
          pinMessage.textContent = "Szia Éva, boldog szülinapot!";
          naughtyStep = 0;
          setTimeout(() => {
            pinMessage.textContent = "";
            startSelectedVideo(data.video);
          }, 1200);
        } else {
          naughtyStep++;
          if (naughtyStep === 1) {
            pinMessage.textContent = "Te kis huncut!";
            pinPanel.classList.add("shake");
            setTimeout(() => pinPanel.classList.remove("shake"), 400);
          } else {
            pinMessage.textContent = "Ha nem az Éva vagy, töröld ki a kódot, hagyd üresen, és menj a Továbbal.";
            pinPanel.classList.add("shake");
            setTimeout(() => pinPanel.classList.remove("shake"), 400);
          }
        }
      } catch (err) {
        console.log("Worker hiba:", err);
        naughtyStep++;
        if (naughtyStep === 1) {
          pinMessage.textContent = "Te kis huncut!";
          pinPanel.classList.add("shake");
          setTimeout(() => pinPanel.classList.remove("shake"), 400);
        } else {
          pinMessage.textContent = "Ha nem az Éva vagy, töröld ki a kódot, hagyd üresen, és menj a Továbbal.";
          pinPanel.classList.add("shake");
          setTimeout(() => pinPanel.classList.remove("shake"), 400);
        }
      }
    }

    pinInputs.forEach((input, index) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);

        if (pinInputs.every(i => i.value === "")) {
          naughtyStep = 0;
          pinMessage.textContent = "";
        }

        if (input.value && index < pinInputs.length - 1) {
          pinInputs[index + 1].focus();
        }
      });

      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && index > 0) {
          pinInputs[index - 1].focus();
        }
        if (e.key === "Enter") {
          handlePinSubmit();
        }
      });
    });

    continueBtn.onclick = () => {
      handlePinSubmit();
    };

    playBtn.onclick = async () => {
      endShown = false;
      mobileEndScreen.style.display = 'none';
      giftOverlay.classList.remove('show', 'withBg');

      giftVideo.pause();
      giftVideo.removeAttribute('src');
      giftVideo.load();

      resetPinUI();

      videoScreen.style.display = 'flex';
      showScreen(videoScreen);

      mainVideo.src = VIDEO_URL + "?t=" + Date.now();
      mainVideo.load();

      try {
        await mainVideo.play();
      } catch (e) {
        console.log("Main video play hiba:", e);
      }
    };

  mainVideo.addEventListener('timeupdate', () => {
  if (!endShown && mainVideo.currentTime >= END_TIME) {
    endShown = true;
    mainVideo.pause();

    exitFullscreenMobile();

    videoScreen.classList.remove('active');
    videoScreen.style.display = 'none';

    resetPinUI();
    mobileEndScreen.style.display = 'block';

    setTimeout(() => {
      digit1.focus();
    }, 300);
  }
});

    giftCloseBtn.onclick = () => {
      giftVideo.pause();
      giftVideo.currentTime = 0;
      giftOverlay.classList.remove('show', 'withBg');
      showScreen(startScreen);
    };

    giftVideo.addEventListener('ended', () => {
      giftVideo.currentTime = 0;
      giftOverlay.classList.remove('show', 'withBg');
      showScreen(startScreen);
    });
   pinPanel.addEventListener('click', () => {
  setTimeout(() => {
    digit1.focus();
  }, 50);
}); 
  </script>
</body>
</html>
